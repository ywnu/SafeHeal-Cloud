name: CI — Python tests

on:
  push:
    branches:
      - main
      - integration/frontend-ready
      - feature/webapp-integration
      - feature/render-deployment
  pull_request:
    branches:
      - main
      - integration/frontend-ready
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Fresh install and tests (Python 3.11, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      AI_MODE: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt

      - name: Install pinned direct dependencies in clean Python environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check resolved dependency compatibility
        run: python -m pip check

      - name: Run synthetic model-quality probe (MOCK only; NO credits)
        run: python -m ai.benchmark --output benchmark-mock.json

      - name: Run offline test suite without Nebius credentials
        run: python -m pytest -q

  browser-e2e:
    name: Chromium browser E2E (public mock only)
    # Playwright 1.56 does not install Chromium on GitHub's Ubuntu 26.04 image.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AI_MODE: mock
      SAFEHEAL_ALLOW_LIVE_DEMO: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime and browser test dependencies
        run: |
          python -m pip install -r backend/requirements.txt -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
          python -m pip check

      - name: Run real Chromium browser flow (no Nebius)
        run: python e2e/browser_smoke.py

  docker-compose:
    name: Docker Compose build and public mock smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      SAFEHEAL_DEMO_PASSWORD: ci-only-compose-password-not-for-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose and build secure local demo image
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up --no-build -d

      - name: Check running container and public mock analysis
        run: |
          python - <<'PY'
          import http.client, json, time, urllib.error, urllib.request

          base = "http://127.0.0.1:8000"
          deadline = time.monotonic() + 45
          while True:
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=2) as response:
                      assert json.load(response) == {"status": "ok"}
                  break
              except (OSError, http.client.HTTPException, TimeoutError):
                  if time.monotonic() >= deadline:
                      raise
                  time.sleep(1)

          with urllib.request.urlopen(base + "/web/demo-analysis", timeout=20) as response:
              analysis = json.load(response)
          assert analysis["status"] == "completed"
          assert analysis["ai"]["source"] == "mock"
          assert len(analysis["findings"]) >= 4
          assert analysis["tests"]["proposed_patch"]["passed"] is True
          assert analysis["response"]["mode"] == "simulation"

          try:
              urllib.request.urlopen(
                  urllib.request.Request(base + "/web/team-nebius-demo", method="POST"),
                  timeout=3,
              )
          except urllib.error.HTTPError as exc:
              assert exc.code == 503, exc.code
          else:
              raise AssertionError("Disabled real-model endpoint unexpectedly accepted a request")
          print("PASS: Docker Compose local mock service + real-model opt-in protection")
          PY

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop Compose services
        if: always()
        run: docker compose down -v --remove-orphans

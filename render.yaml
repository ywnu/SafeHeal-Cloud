# SafeHeal Cloud: public mock analysis and optional public Nemotron demo.
# Keep AI_MODE=mock; only the fixed synthetic live endpoint runs paid inference.
services:
  - type: web
    name: safeheal-cloud
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn webapp.public:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AI_MODE
        value: mock
      - key: SAFEHEAL_DEMO_PASSWORD
        sync: false
      - key: SAFEHEAL_ALLOW_LIVE_DEMO
        value: "true"
      - key: SAFEHEAL_MAX_LIVE_ANALYSES_PER_HOUR
        value: "12"
      - key: NEBIUS_MODEL
        value: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B
